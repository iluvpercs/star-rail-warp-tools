<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Star Rail Warp Tools</title>
  <desc id="desc">Dark space-inspired banner with blue, purple, and gold accents.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1022"/>
      <stop offset="55%" stop-color="#151a3a"/>
      <stop offset="100%" stop-color="#241a43"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5aa9ff"/>
      <stop offset="50%" stop-color="#9b7bff"/>
      <stop offset="100%" stop-color="#e9c46a"/>
    </linearGradient>
    <linearGradient id="rail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5aa9ff" stop-opacity="0"/>
      <stop offset="35%" stop-color="#7f9cff" stop-opacity="0.9"/>
      <stop offset="75%" stop-color="#b38cff" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#e9c46a" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#8ea2ff" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#9b7bff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#9b7bff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#grid)"/>
  <circle cx="930" cy="150" r="190" fill="url(#glow)"/>

  <g fill="#dfe8ff">
    <circle cx="120" cy="70" r="1.6" opacity="0.8"/>
    <circle cx="210" cy="220" r="1.2" opacity="0.5"/>
    <circle cx="330" cy="55" r="1.1" opacity="0.6"/>
    <circle cx="760" cy="80" r="1.5" opacity="0.7"/>
    <circle cx="1040" cy="230" r="1.3" opacity="0.6"/>
    <circle cx="1120" cy="60" r="1.7" opacity="0.8"/>
    <circle cx="640" cy="250" r="1.2" opacity="0.5"/>
  </g>

  <g stroke="url(#rail)" fill="none" stroke-width="2">
    <path d="M 40 246 C 260 246, 360 210, 600 210 C 840 210, 940 246, 1160 246"/>
    <path d="M 40 258 C 260 258, 360 222, 600 222 C 840 222, 940 258, 1160 258" stroke-opacity="0.45"/>
  </g>
  <g fill="#e9c46a">
    <circle cx="600" cy="216" r="3.5"/>
    <circle cx="840" cy="222" r="2.5" opacity="0.8"/>
    <circle cx="360" cy="222" r="2.5" opacity="0.8"/>
  </g>

  <rect x="60" y="58" width="220" height="4" rx="2" fill="url(#accent)"/>

  <text x="60" y="122" fill="#dfe8ff" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="30" font-weight="300" letter-spacing="8">STAR RAIL</text>
  <text x="60" y="182" fill="#ffffff" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="58" font-weight="700" letter-spacing="2">WARP TOOLS</text>
  <text x="62" y="218" fill="#aebdf5" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="18" font-weight="400">Astral Express · Warp History Link Utility</text>

  <text x="1140" y="276" fill="#7f8dbd" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12" letter-spacing="3" text-anchor="end">UNOFFICIAL FAN PROJECT</text>
</svg>
