name: Feature request
description: Suggest an improvement to the script or documentation
title: "[Enhancement]: "
body:
  - type: markdown
    attributes:
      value: |
        Please keep requests compatible with the project's constraint: a single Windows PowerShell utility with no phone-side installation.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: "What limitation are you running into?"
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: "Describe the change and any alternatives you considered."
    validations:
      required: true

  - type: checkboxes
    id: constraints
    attributes:
      label: Constraints
      options:
        - label: "The change preserves `irm ... | iex` usage"
        - label: "The change adds no telemetry or unnecessary network requests"
        - label: "The change does not expose Warp URLs in console output"
