name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  powershell:
    name: PowerShell validation
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate PowerShell syntax
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = (Get-Location).Path
          $files = @(Get-ChildItem -Path . -Recurse -Filter '*.ps1' -File)
          if ($files.Count -eq 0) {
            Write-Host 'No PowerShell scripts found.'
            return
          }

          $failed = $false
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              $file.FullName, [ref]$tokens, [ref]$errors
            )
            $relative = ($file.FullName.Substring($root.Length + 1)) -replace '\\', '/'
            if ($errors.Count -gt 0) {
              $failed = $true
              Write-Host "::error file=$relative::Parser found $($errors.Count) error(s)"
              $errors | ForEach-Object { Write-Host "  $($_.Message)" }
            }
            else {
              Write-Host "Syntax OK: $relative"
            }
          }

          if ($failed) { exit 1 }

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module -Name PSScriptAnalyzer -Scope CurrentUser -Force

      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $issues = @(Invoke-ScriptAnalyzer -Path . -Recurse -Settings ./.psscriptanalyzer.psd1)

          if ($issues.Count -gt 0) {
            $issues |
              Select-Object RuleName, Severity, ScriptName, Line, Message |
              Format-Table -AutoSize |
              Out-String -Width 200 |
              Write-Host
          }

          $errors = @($issues | Where-Object { $_.Severity -eq 'Error' })
          if ($errors.Count -gt 0) {
            Write-Host "::error::PSScriptAnalyzer reported $($errors.Count) error-severity finding(s)"
            exit 1
          }

          Write-Host "PSScriptAnalyzer: no error-severity findings ($($issues.Count) warning/information finding(s))."
