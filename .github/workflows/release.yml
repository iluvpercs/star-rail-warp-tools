name: Release

# Triggered only by version tags such as v1.0.0.
on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify tag format
        shell: bash
        run: |
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tags must look like v1.0.0"
            exit 1
          fi

      - name: Package source files
        shell: bash
        run: |
          mkdir -p dist
          zip -j "dist/star-rail-warp-tools-${GITHUB_REF_NAME}.zip" \
            get-warp-link.ps1 \
            README.md \
            CHANGELOG.md \
            CONTRIBUTING.md

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            "dist/star-rail-warp-tools-${GITHUB_REF_NAME}.zip"
